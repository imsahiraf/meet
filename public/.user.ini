; FR-202 File Storage settings default to a 25MB upload ceiling
; (Modules/Media/config/config.php, admin-configurable). PHP's own
; upload_max_filesize/post_max_size are PHP_INI_PERDIR directives -
; they can't be raised at runtime via ini_set(), only here (or in
; php.ini/.htaccess). On cPanel's typical PHP-FPM/CGI-FCGI SAPI this
; .user.ini is read automatically per-directory; on mod_php hosts
; without .user.ini support, the cPanel "MultiPHP INI Editor" must be
; used instead - see DEPLOYMENT.md.
upload_max_filesize = 30M
post_max_size = 32M
max_execution_time = 300
memory_limit = 256M
